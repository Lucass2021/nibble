spring.application.name=nibble
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/nibble
spring.datasource.username=nibble
spring.datasource.password=nibble
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.mail.host=localhost
spring.mail.port=1025

magic-link.expiration=15m
jwt.secret=${JWT_SECRET}
jwt.expiration=60m

openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=deepseek/deepseek-chat
openrouter.connect-timeout=3s
openrouter.read-timeout=60s

spring.mvc.problemdetails.enabled=true