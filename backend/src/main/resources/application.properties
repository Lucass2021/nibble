spring.application.name=nibble
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nibble}
spring.datasource.username=${DB_USERNAME:nibble}
spring.datasource.password=${DB_PASSWORD:nibble}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mvc.problemdetails.enabled=true
magic-link.expiration=15m
jwt.secret=${JWT_SECRET}
jwt.expiration=60m
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=deepseek/deepseek-chat
openrouter.connect-timeout=3s
openrouter.read-timeout=60s
management.endpoint.health.show-details=${HEALTH_DETAILS:never}