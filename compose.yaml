services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nibble
      POSTGRES_USER: nibble
      POSTGRES_PASSWORD: nibble
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: